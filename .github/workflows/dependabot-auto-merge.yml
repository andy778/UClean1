name: Dependabot auto-merge

# Auto-approve and enable auto-merge for Dependabot minor/patch bumps, so
# routine dependency updates land without manual attention. Major bumps still
# require a human. Requires the repo setting "Allow auto-merge" to be enabled.

# pull_request_target is required here so GITHUB_TOKEN has write access to
# approve/merge; no PR code is checked out or executed (only fetch-metadata,
# which reads PR metadata, and gh pr review/merge), so the usual
# pull_request_target code-injection risk doesn't apply. See .github/zizmor.yml.
on: pull_request_target

permissions: read-all

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Approve and enable auto-merge (minor/patch only)
        if: >
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
